plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven{ url "https://maven.ladysnake.org/releases" }
	maven{ url "https://maven.blamejared.com/" }
	maven{ url "https://maven.nucleoid.xyz/" }
}	

dependencies {
	// Test Unit
	testImplementation "org.junit.platform:junit-platform-launcher"
	testImplementation "org.junit.jupiter:junit-jupiter-api:5.8.1"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.8.1"

	// Code Environment
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2" // Even tho fabric say you can delete this but you cant compile if doest include this
	compileOnly "io.github.toxicity188:bettermodel-fabric:${project.bettermodel_version}" // BetterModel Compatibility

	// Cardinal (Library)
	implementation include("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
	implementation include("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name
	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
	destinationDirectory.set(file("D:\\project\\server\\26.1 - fabric\\mods")) // TODO: Dont forget to comment this
}